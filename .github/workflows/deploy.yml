name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: nextbillion-se-team-2026
  REGION: us-central1
  SERVICE: fuelroute-express
  IMAGE: us-central1-docker.pkg.dev/nextbillion-se-team-2026/fuelroute-express/fuelroute-express

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only the image changes here. Secrets, env vars, the Cloud SQL mount,
      # sizing and the runtime SA are owned by terraform/ and carried over
      # from the current revision.
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "${IMAGE}:${GITHUB_SHA}" --quiet
          echo "url=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - run: echo "Deployed ${GITHUB_SHA::7} to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
